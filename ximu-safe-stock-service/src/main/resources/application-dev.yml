# =============================================================================
# 本地开发 profile（--spring.profiles.active=dev 显式激活）
# -----------------------------------------------------------------------------
# 提供开发兜底，避免本地起服务必须注入环境变量（P0-2 平衡项）。
# 数据库等非密钥默认值仍由 application.yml 提供（localhost/root/123456）。
# =============================================================================

app:
  # 与 ximu-gateway application-dev.yml 的兜底值一致；
  # 直连调试（不经网关）需带 -H "X-Gateway-Token: dev-shared-gateway-token"，
  # 或用环境变量 GATEWAY_TOKEN= 空串临时关闭校验。
  gateway-token: dev-shared-gateway-token
  auth:
    # dev 追加 swagger 文档路径（默认/生产不含 → 404，收敛暴露面）
    public-paths: "/actuator/health,/actuator/info,/swagger-ui,/v3/api-docs"
