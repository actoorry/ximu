# =============================================================================
# 生产部署安全警告（IMPORTANT）
# -----------------------------------------------------------------------------
# 生产环境必须通过环境变量注入以下配置，严禁使用本文件中的默认值出生产：
#   - DB_URL          数据库连接串（含库名、字符集、时区）
#   - DB_USERNAME     数据库账号
#   - DB_PASSWORD     数据库密码
#   - JWT_SECRET      JWT 签名密钥（>=32 字节随机串，仅网关使用）
#   - CORS_ORIGINS    允许的前端来源（逗号分隔多个域名）
# 本文件中的默认值（localhost / root / 123456 / localhost:5173 等）仅为本地开发兜底。
# 生产激活方式：--spring.profiles.active=prod（见同目录 application-prod.yml，缺失必填项会启动失败）。
# =============================================================================

server:
  port: 8082

spring:
  application:
    name: ximu-safe-stock-service
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/ximu?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:123456}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  sql:
    init:
      # 开发环境可改为 always 自动建表+种子数据；生产环境必须 never（用 Flyway/Liquibase 或手动管理 DDL）
      mode: never
      encoding: UTF-8
  flyway:
    # 迁移权归 inventory-service（同库 ximu 防双写），本服务显式关闭 Flyway，不参与迁移
    enabled: false

# 跨域允许的前端来源（逗号分隔），统一走 CORS_ORIGINS 环境变量；生产按真实域名收紧，不要回退为 *
app:
  cors:
    allowed-origins: "${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}"
  # 内部共享令牌：与网关 GATEWAY_TOKEN 一致，校验请求确经网关（防直连伪造身份）。
  # 无兜底值（P0-2）：缺 GATEWAY_TOKEN 启动即失败；dev profile 兜底 dev-shared-gateway-token；
  # 需临时直连调试（curl 不带 X-Gateway-Token）可用环境变量 GATEWAY_TOKEN= 空串关闭校验。
  gateway-token: "${GATEWAY_TOKEN}"
  auth:
    # 生产保持 true（要求网关注入身份头）；仅本地开发可临时 false
    enabled: true
    # 公开路径白名单（P0-5，前缀匹配）：白名单外且非 /api/ 前缀的路径一律 404；
    # 默认/生产不含 swagger（收敛暴露面，见 P2-3），本地开发经 application-dev.yml 追加。
    public-paths: "/actuator/health,/actuator/info"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 仅暴露健康检查与信息端点，避免泄露内部细节
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.by.ximu: info
