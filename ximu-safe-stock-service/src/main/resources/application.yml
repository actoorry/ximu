# =============================================================================
# 生产部署安全警告（IMPORTANT）
# -----------------------------------------------------------------------------
# 生产环境必须通过环境变量注入以下配置，严禁使用本文件中的默认值出生产：
#   - DB_URL          数据库连接串（含库名、字符集、时区）
#   - DB_USERNAME     数据库账号
#   - DB_PASSWORD     数据库密码
#   - JWT_SECRET      JWT 签名密钥（>=32 字节随机串，仅网关使用）
#   - CORS_ORIGINS    允许的前端来源（逗号分隔多个域名）
# 本文件中的默认值（localhost / root / 123456 / localhost:5173 等）仅为本地开发兜底。
# 生产激活方式：--spring.profiles.active=prod（见同目录 application-prod.yml，缺失必填项会启动失败）。
# =============================================================================

server:
  port: 8082

spring:
  application:
    name: ximu-safe-stock-service
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/ximu?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:123456}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  sql:
    init:
      # 开发环境可改为 always 自动建表+种子数据；生产环境必须 never（用 Flyway/Liquibase 或手动管理 DDL）
      mode: never
      encoding: UTF-8
  flyway:
    # 迁移权归 inventory-service（同库 ximu 防双写），本服务显式关闭 Flyway，不参与迁移
    enabled: false

# 跨域允许的前端来源（逗号分隔），统一走 CORS_ORIGINS 环境变量；生产按真实域名收紧，不要回退为 *
app:
  cors:
    allowed-origins: "${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}"
  auth:
    # 生产保持 true（要求网关注入身份头）；仅本地开发可临时 false
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 仅暴露健康检查与信息端点，避免泄露内部细节
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.by.ximu: info
