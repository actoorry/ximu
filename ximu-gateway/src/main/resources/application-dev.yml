# =============================================================================
# 本地开发 profile（--spring.profiles.active=dev 显式激活）
# -----------------------------------------------------------------------------
# 提供开发专用兜底密钥，避免本地起服务必须注入环境变量（P0-2 平衡项）。
# 注意：dev 密钥是公开固定值（已提交 git），仅用于本地联调；
#       生产严禁激活 dev profile（生产必须 prod，密钥经环境变量注入）。
# =============================================================================

app:
  jwt:
    # dev 专用固定密钥（43 字节 >= 32，非 change-me 前缀，不在弱密钥黑名单内）
    secret: dev-only-fixed-jwt-secret-2026-not-for-prod-use
  # 与下游两服务 application-dev.yml 的兜底值一致，联调时下游校验 X-Gateway-Token
  gateway-token: dev-shared-gateway-token
