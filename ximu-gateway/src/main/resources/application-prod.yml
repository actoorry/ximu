# =============================================================================
# 网关生产配置（--spring.profiles.active=prod）
# -----------------------------------------------------------------------------
# 与本地开发默认值（application.yml）的关键差异：
#   1. JWT_SECRET / GATEWAY_TOKEN 无默认值，缺失任一环境变量即启动失败（Could not resolve placeholder）。
#   2. CORS_ORIGINS 无默认值，生产按真实域名注入，不要回退为 *。
# =============================================================================
app:
  jwt:
    secret: "${JWT_SECRET}"
  gateway-token: "${GATEWAY_TOKEN}"
