# =============================================================================
# 生产部署安全警告（IMPORTANT）
# -----------------------------------------------------------------------------
# 生产必须通过环境变量注入 JWT_SECRET（>=32 字节随机串，可用 openssl rand -base64 48 生成），
# 严禁使用下方默认值；默认值仅为本地开发兜底。
# CORS 允许来源通过 CORS_ORIGINS 环境变量注入（逗号分隔多个域名）。
# =============================================================================

server:
  port: 8080

spring:
  application:
    name: ximu-gateway
  cloud:
    gateway:
      routes:
        - id: inventory-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/inventory/**
        - id: safe-stock-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/safe-stock/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            # CORS_ORIGINS 为逗号分隔的多个来源；Spring Boot 绑定 List<String> 时会自动按逗号拆分。
            # 生产示例：CORS_ORIGINS=https://erp.example.com,https://admin.example.com
            # 注意：allowCredentials=true 时不要回退为 *（否则会被视为不安全而失效）。
            allowedOriginPatterns: "${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

app:
  jwt:
    # 生产必须通过环境变量 JWT_SECRET 注入（>=32 字节随机串），禁止使用默认值
    secret: "${JWT_SECRET:change-me-please-use-a-32-byte-min-secret-key}"
  # 内部共享令牌：注入 X-Gateway-Token 头，下游服务据此校验请求确经网关（防直连伪造身份）。
  # 生产必须设置 GATEWAY_TOKEN（与下游服务一致）；本地开发留空则不注入、下游不校验。
  gateway-token: "${GATEWAY_TOKEN:}"
  auth:
    skip-prefixes: "/actuator"

management:
  endpoints:
    web:
      exposure:
        include: health,info
